name: CI

on:
  pull_request:
    branches: [main, staging, develop, 'release/**']
  push:
    branches: [main, staging, develop, 'release/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    # The suite takes a few minutes; a hung test must not hold a runner for 6 hours.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-lines coverage check diffs against the base branch.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic

      - name: Quality bar (CLAUDE.md)
        run: bash scripts/quality-bar.sh

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --blame-hang-timeout 5m --blame-hang-dump-type none --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --settings coverage.runsettings --collect:"XPlat Code Coverage"

      # Each module's migrations must still script against the built API (the
      # startup project), so a model change without a migration fails here.
      - name: EF migrations dry-run
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.5
          for module in Auth Account; do
            dotnet ef migrations script --idempotent --no-build --configuration Release \
              --project "src/Modules/$module/Balsm.$module.Infrastructure" \
              --startup-project src/Balsm.API \
              --context "${module}DbContext" \
              --output "$RUNNER_TEMP/$module-migration.sql"
          done

      - name: Generate coverage report
        if: ${{ always() && hashFiles('**/TestResults/**/coverage.cobertura.xml') != '' }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:'**/TestResults/**/coverage.cobertura.xml' -targetdir:coverage-report -reporttypes:'HtmlInline_AzurePipelines;Cobertura;TextSummary'

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage-report/Cobertura.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'
          retention-days: 30

      - name: Post coverage comment on PR
        if: ${{ github.event_name == 'pull_request' && always() && hashFiles('coverage-report/Cobertura.xml') != '' }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage-report/Cobertura.xml
          badge: true
          format: markdown
          output: both
          thresholds: '80 80'
          # Fails the job when total line coverage drops below the first
          # threshold. Raise it as coverage grows; never lower it to pass.
          fail_below_min: true

      - name: Add coverage to PR
        if: ${{ github.event_name == 'pull_request' && always() && hashFiles('code-coverage-results.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

      # New and changed lines must be tested, whatever the total: a PR fails
      # when fewer than 80% of the lines it adds or edits are covered.
      - name: Changed-lines coverage
        if: ${{ github.event_name == 'pull_request' && hashFiles('coverage-report/Cobertura.xml') != '' }}
        run: |
          pipx install diff-cover==11.0.0
          diff-cover coverage-report/Cobertura.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=80 \
            --format markdown:changed-lines-coverage.md

      - name: Add changed-lines coverage to PR
        if: ${{ github.event_name == 'pull_request' && always() && hashFiles('changed-lines-coverage.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: changed-lines-coverage
          recreate: true
          path: changed-lines-coverage.md
