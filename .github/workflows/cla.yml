# أضف هذا الملف في:
# .github/workflows/cla.yml

name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The repo default token is read-only; the action commits signatures and
# comments on / sets the status of the PR.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://gist.github.com/balsm-assistant/255ba048aa8e57de5bc11fd4211e3f72'
          # Signatures live on their own unprotected branch: main requires PRs
          # and signed commits, so the action cannot commit to it.
          branch: 'cla-signatures'
          allowlist: bot*