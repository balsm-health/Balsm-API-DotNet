name: Deploy Staging

on:
  push:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the push's "before" commit is always present as a
          # diff base. A shallow clone breaks git diff when a push contains more
          # commits than the fetch depth (fatal: bad object <before>).
          fetch-depth: 0

      - name: Detect deployment-impacting changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          # Fall back to the full tree (→ deploy) when there is no usable diff
          # base: a new branch (all-zero before) or a before commit not in the
          # clone (force-push / pruned). Fail-safe = deploy, never silently skip.
          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            files="$(git ls-tree -r --name-only "$after")"
          else
            files="$(git diff --name-only "$before" "$after")"
          fi

          printf '%s\n' "$files"

          deploy=false
          while IFS= read -r file; do
            case "$file" in
              src/*|Dockerfile|docker-compose.yml|.dockerignore|.env.staging.example|Directory.Build.props|Directory.Packages.props|global.json|scripts/*|.github/workflows/deploy-staging.yml)
                deploy=true
                break
                ;;
            esac
          done <<< "$files"

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy on staging server
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BRANCH: feature/phase-01/mvp
          REPO_DIR: /root/Balsm-API-DotNet
          # The one thing that names this environment's hosts. Every host is
          # the production name with -<suffix> appended to its first label
          # (api-stg.balsm.health, app-stg.balsm.health); no suffix means the
          # production names. scripts/deploy-staging.sh derives the rest and
          # writes it into the server's env file on every deploy. Needs a
          # DNS-only A record for api-<suffix>.balsm.health first: the
          # certificate is issued over HTTP-01.
          HOST_SUFFIX: stg
          # The host staging had before it was renamed, kept routed for builds
          # already installed. Delete once none are left.
          APP_DOMAIN_LEGACY: api-stg-balsm-health.mosalam.com
          # Resend key = GitHub secret; the web-app URL = optional repo variable.
          # Both are upserted into .env.staging by scripts/deploy-staging.sh; an
          # empty value leaves the existing file entry untouched.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OTP_WEB_APP_URL: ${{ vars.OTP_WEB_APP_URL }}
          # Social sign-in audiences and error reporting. Left unset these
          # interpolate empty into compose, which silently breaks Google/Apple
          # token validation and sends no events to Sentry.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
          SENTRY_PROFILES_SAMPLE_RATE: ${{ vars.SENTRY_PROFILES_SAMPLE_RATE }}
        shell: bash
        run: |
          set -euo pipefail

          sshpass -p "$PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$USERNAME@$HOST" \
            "REPO_DIR='$REPO_DIR' BRANCH='$BRANCH' \
             HOST_SUFFIX='$HOST_SUFFIX' APP_DOMAIN_LEGACY='$APP_DOMAIN_LEGACY' \
             RESEND_API_KEY='$RESEND_API_KEY' OTP_WEB_APP_URL='$OTP_WEB_APP_URL' \
             GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' APPLE_CLIENT_ID='$APPLE_CLIENT_ID' \
             SENTRY_DSN='$SENTRY_DSN' \
             SENTRY_TRACES_SAMPLE_RATE='$SENTRY_TRACES_SAMPLE_RATE' \
             SENTRY_PROFILES_SAMPLE_RATE='$SENTRY_PROFILES_SAMPLE_RATE' \
             bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REPO_DIR"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          bash scripts/deploy-staging.sh
          REMOTE
