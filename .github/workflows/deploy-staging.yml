name: Deploy Staging

on:
  push:
    branches:
      - feature/phase-01/mvp
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect deployment-impacting changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [[ "$before" =~ ^0+$ ]]; then
            files="$(git ls-tree -r --name-only "$after")"
          else
            files="$(git diff --name-only "$before" "$after")"
          fi

          printf '%s\n' "$files"

          deploy=false
          while IFS= read -r file; do
            case "$file" in
              src/*|Dockerfile|docker-compose.yml|.dockerignore|.env.staging.example|Directory.Build.props|Directory.Packages.props|global.json|scripts/*|.github/workflows/deploy-staging.yml)
                deploy=true
                break
                ;;
            esac
          done <<< "$files"

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy on staging server
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BRANCH: feature/phase-01/mvp
          REPO_DIR: /root/Balsm-API-DotNet
        shell: bash
        run: |
          set -euo pipefail

          sshpass -p "$PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$USERNAME@$HOST" \
            "REPO_DIR='$REPO_DIR' BRANCH='$BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REPO_DIR"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          bash scripts/deploy-staging.sh
REMOTE
