# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - Baslm-API-Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish src/Balsm.API/Balsm.API.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0E13A18985044217898D86EEC5E08358 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_43F20D08364540E198702B430E17B39D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B4FA0683D02A4D73A484755C6F5B90D4 }}

      # Inject the Resend key (GitHub secret) + magic-link sender/scheme as App
      # Service settings → env vars at runtime (Resend__ApiKey, etc.). Merges
      # with existing settings, so Otp__LinkBaseUrl / Otp__WebAppUrl set in the
      # portal for this environment are preserved.
      - name: Configure App Service settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'Baslm-API-Dev'
          app-settings-json: |
            [
              { "name": "Resend__ApiKey", "value": "${{ secrets.RESEND_API_KEY }}", "slotSetting": false },
              { "name": "Resend__From", "value": "Balsm <noreply@balsm.health>", "slotSetting": false },
              { "name": "Otp__AppLinkScheme", "value": "balsm", "slotSetting": false }
            ]

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Baslm-API-Dev'
          slot-name: 'Production'
          package: .
          