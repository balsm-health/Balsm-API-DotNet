name: P001 API CI

on:
  push:
    branches: [main, staging, develop, 'release/**']
  pull_request:
    branches: [main, staging, develop, 'release/**']

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build --no-restore -warnaserror

      - name: Format check
        run: dotnet format --verify-no-changes

      # No database settings here: the integration tests bring their own
      # (a temp SQLite file, or Postgres via Testcontainers). An env connection
      # string overrides theirs and breaks the SQLite-backed host.
      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.5

      - name: EF migrations dry-run (Auth)
        run: dotnet ef migrations script --idempotent --no-build --project src/Modules/Auth/Balsm.Auth.Infrastructure --startup-project src/Balsm.API --context AuthDbContext --output /tmp/auth-migration.sql

      - name: EF migrations dry-run (Account)
        run: dotnet ef migrations script --idempotent --no-build --project src/Modules/Account/Balsm.Account.Infrastructure --startup-project src/Balsm.API --context AccountDbContext --output /tmp/account-migration.sql
