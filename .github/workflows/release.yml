name: Release — Executable Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & package all platforms
        run: bash scripts/publish-all.sh ${{ steps.version.outputs.version }}

      - name: Upload raw artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raw-builds
          path: artifacts/

      - name: Upload dist archives
        uses: actions/upload-artifact@v4
        with:
          name: dist-archives
          path: artifacts/dist/

  package-linux:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download raw build
        uses: actions/download-artifact@v4
        with:
          name: raw-builds
          path: artifacts

      - name: Build .deb package
        run: bash packaging/linux/build-deb.sh ${{ needs.build.outputs.version }}

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: artifacts/dist/*.deb

  package-windows:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download raw build
        uses: actions/download-artifact@v4
        with:
          name: raw-builds
          path: artifacts

      - name: Bundle install scripts into Windows archive
        run: |
          cp packaging/windows/install.ps1 artifacts/win-x64/
          cp packaging/windows/uninstall.ps1 artifacts/win-x64/
          cd artifacts/win-x64
          zip -q -r "../dist/balsam-api-${{ needs.build.outputs.version }}-win-x64.zip" .

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: win-package
          path: artifacts/dist/*-win-x64.zip

  package-macos:
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download raw build
        uses: actions/download-artifact@v4
        with:
          name: raw-builds
          path: artifacts

      - name: Build .pkg installer
        run: bash packaging/macos/build-pkg.sh ${{ needs.build.outputs.version }}

      - name: Upload .pkg installer
        uses: actions/upload-artifact@v4
        with:
          name: pkg-package
          path: artifacts/dist/*.pkg

  package-docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/balsam-api:${{ needs.build.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/balsam-api:latest

  release:
    needs: [build, package-linux, package-windows, package-macos, package-docker]
    runs-on: ubuntu-latest

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: List release files
        run: find packages -type f | sort

      - name: Generate checksums
        run: |
          cd packages
          sha256sum balsam-api-* *.deb 2>/dev/null > checksums-sha256.txt || true
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Balsam API ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            packages/balsam-api-*
            packages/*.deb
            packages/checksums-sha256.txt
