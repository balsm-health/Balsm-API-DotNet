- name: OTP
  meta:
    id: fld_auth_otp
    created: 1735689600000
    modified: 1735689600000
    sortKey: -1000
  children:
  - url: '{{ _.base_url }}/auth/otp/request'
    name: POST /auth/otp/request (signup)
    description: >-
      purpose is required: signup (sign-up screen), continue (also accepted as
      register, from older apps), reset or delete; anything else returns 400
      InvalidPurpose. signup and continue send the code whether or not the email
      has an account, so the response never says which. The exception is
      signup while sign-up is strict (Auth:SignUp:RevealExisting=on, or auto
      after the email provider refuses for quota, the global OTP limit is hit,
      or more than Auth:SignUp:StrictAfterEmailsPerHour codes went out this
      hour): then a registered email returns 409 EmailRegistered and no email
      is sent. language (optional, en|ar; falls back to Accept-Language, then
      en) picks the email's language.
    meta:
      id: req_auth_otp_request
      created: 1735689600000
      modified: 1735689600000
      sortKey: -1000
    method: POST
    headers:
    - name: Content-Type
      value: application/json
    - name: X-Correlation-Id
      value: 00000000-0000-0000-0000-000000000001
    body:
      mimeType: application/json
      text: "{\n  \"email\": \"jane.doe@example.com\",\n  \"countryCode\": \"EG\",\n  \"captchaToken\": \"recaptcha-test-token\",\n  \"purpose\": \"signup\",\n  \"language\": \"en\"\n}\n"
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: '{{ _.base_url }}/auth/otp/request'
    name: POST /auth/otp/request (reset)
    description: >-
      Forgot-password. reset on a known email sends the code; on an unknown email
      it returns 200 with no email (anti-enumeration). Submit the emailed code to
      POST /auth/password/reset.
    meta:
      id: req_auth_otp_request_reset
      created: 1735689600000
      modified: 1735689600000
      sortKey: -1500
    method: POST
    headers:
    - name: Content-Type
      value: application/json
    - name: X-Correlation-Id
      value: 00000000-0000-0000-0000-000000000001
    body:
      mimeType: application/json
      text: "{\n  \"email\": \"jane.doe@example.com\",\n  \"countryCode\": \"EG\",\n  \"captchaToken\": \"recaptcha-test-token\",\n  \"purpose\": \"reset\",\n  \"language\": \"en\"\n}\n"
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: '{{ _.base_url }}/auth/otp/request'
    name: POST /auth/otp/request (delete)
    description: >-
      Account-deletion confirmation code. Like reset, an unknown email returns
      200 with no email (anti-enumeration). The emailed link carries p=delete
      so the app opens the delete-account confirmation after sign-in.
    meta:
      id: req_auth_otp_request_delete
      created: 1735689600000
      modified: 1735689600000
      sortKey: -1400
    method: POST
    headers:
    - name: Content-Type
      value: application/json
    - name: X-Correlation-Id
      value: 00000000-0000-0000-0000-000000000001
    body:
      mimeType: application/json
      text: "{\n  \"email\": \"jane.doe@example.com\",\n  \"countryCode\": \"EG\",\n  \"captchaToken\": \"recaptcha-test-token\",\n  \"purpose\": \"delete\",\n  \"language\": \"en\"\n}\n"
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: '{{ _.base_url }}/auth/otp/verify'
    name: POST /auth/otp/verify
    description: >-
      Redeems the emailed code. Signs an existing user in or creates the
      account; is_new_user says which. Each code allows 5 tries, the right one
      included, and is spent after that. Five failed sign-ins for one address
      in 10 minutes (codes or passwords) lock it for 15: 423 AccountLocked with
      Retry-After, for addresses with no account too. A wrong or spent code is
      401.
    meta:
      id: req_auth_otp_verify
      created: 1735689600000
      modified: 1735689600000
      sortKey: -2000
    method: POST
    headers:
    - name: Content-Type
      value: application/json
    - name: X-Correlation-Id
      value: 00000000-0000-0000-0000-000000000001
    body:
      mimeType: application/json
      text: "{\n  \"email\": \"jane.doe@example.com\",\n  \"code\": \"000000\",\n  \"deviceId\": \"00000000-0000-0000-0000-000000000010\",\n  \"deviceLabel\": \"iPhone 15 (synthetic)\",\n  \"client_account_id\": null\n}\n"
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: '{{ _.base_url }}/auth/password/sign-in'
    name: POST /auth/password/sign-in
    description: >-
      Email and password sign-in. Anonymous. 401 Auth.InvalidCredentials for a
      wrong password or an unknown address alike. Failures count towards the
      address lock shared with code verify: after five in 10 minutes it is
      423 AccountLocked with Retry-After for 15 minutes, checked before the
      password.
    meta:
      id: req_auth_password_sign_in
      created: 1735689600000
      modified: 1735689600000
      sortKey: -1900
    method: POST
    headers:
    - name: Content-Type
      value: application/json
    - name: X-Correlation-Id
      value: 00000000-0000-0000-0000-000000000001
    body:
      mimeType: application/json
      text: "{\n  \"email\": \"jane.doe@example.com\",\n  \"password\": \"synthetic-password\",\n  \"device_id\": \"00000000-0000-0000-0000-000000000010\",\n  \"device_label\": \"iPhone 15 (synthetic)\"\n}\n"
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: '{{ _.base_url }}/auth/password/reset'
    name: POST /auth/password/reset
    description: >-
      Sets a new password with the code from POST /auth/otp/request (reset).
      Anonymous. Revokes the account's other sessions. The code has the same
      5-try limit as verify, and failures count towards the same address lock
      (423 AccountLocked with Retry-After). 401 for a wrong or spent code.
    meta:
      id: req_auth_password_reset
      created: 1735689600000
      modified: 1735689600000
      sortKey: -1800
    method: POST
    headers:
    - name: Content-Type
      value: application/json
    - name: X-Correlation-Id
      value: 00000000-0000-0000-0000-000000000001
    body:
      mimeType: application/json
      text: "{\n  \"email\": \"jane.doe@example.com\",\n  \"code\": \"000000\",\n  \"new_password\": \"synthetic-new-password\"\n}\n"
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: '{{ _.base_url }}/auth/otp/link'
    name: GET /auth/otp/link
    description: >-
      Target of the link in the code email. Anonymous. Redirects to the app
      (balsm://auth/link) or the web app (/auth/link) carrying the one-time
      token t. Optional p (reset|delete) names what the link is for and is
      forwarded as-is; any other value is dropped.
    meta:
      id: req_auth_otp_link
      created: 1735689600000
      modified: 1735689600000
      sortKey: -2500
    method: GET
    parameters:
    - name: t
      value: synthetic-link-token
    - name: p
      value: delete
    headers:
    - name: X-Correlation-Id
      value: 00000000-0000-0000-0000-000000000001
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: 'off'
      cookies:
        send: true
        store: true
      rebuildPath: true
